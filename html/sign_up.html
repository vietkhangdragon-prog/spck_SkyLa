<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyLa — Tạo tài khoản</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/sign_up.css" />

    <!-- ✅ THÊM: Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <!-- LEFT PANEL (giữ nguyên) -->
    <div class="left-panel">
      <div class="cloud cloud1"></div>
      <div class="cloud cloud2"></div>
      <div class="cloud cloud3"></div>
      <div class="brand">
        <div class="logo-circle">🌤️</div>
        <div class="brand-name">Sky<span>La</span></div>
        <div class="brand-tagline">
          Thời tiết thông minh cho cuộc sống của bạn
        </div>
      </div>
      <div class="feature-list">
        <div class="feature-item">
          <div class="feature-icon">🗺️</div>
          <span>Bản đồ thời tiết thế giới tương tác</span>
        </div>
        <div class="feature-item">
          <div class="feature-icon">📊</div>
          <span>Dự báo 7 ngày chi tiết</span>
        </div>
        <div class="feature-item">
          <div class="feature-icon">🏙️</div>
          <span>So sánh thời tiết nhiều thành phố</span>
        </div>
        <div class="feature-item">
          <div class="feature-icon">📰</div>
          <span>Tin tức thời tiết cập nhật liên tục</span>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <div class="form-header">
        <div class="form-title">Tạo tài khoản</div>
        <div class="form-subtitle">
          Tham gia SkyLa để trải nghiệm thời tiết theo cách mới
        </div>
      </div>

      <!-- ✅ THÊM: Thông báo -->
      <div
        id="auth-message"
        style="
          display: none;
          padding: 10px 14px;
          border-radius: 10px;
          margin-bottom: 14px;
          font-size: 13px;
          font-family: &quot;Outfit&quot;, sans-serif;
        "
      ></div>

      <div class="form-row">
        <div class="field">
          <label for="ho">Họ</label>
          <input type="text" id="ho" placeholder="Nguyễn" />
        </div>
        <div class="field">
          <label for="ten">Tên</label>
          <input type="text" id="ten" placeholder="Văn A" />
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="email@example.com" />
      </div>

      <div class="field">
        <label for="city">Thành phố của bạn</label>
        <select id="city">
          <option value="" disabled selected>— Chọn thành phố —</option>
          <option>Hồ Chí Minh</option>
          <option>Hà Nội</option>
          <option>Đà Nẵng</option>
          <option>Cần Thơ</option>
          <option>Hải Phòng</option>
          <option>Khác...</option>
        </select>
      </div>

      <div class="field">
        <label for="pw">Mật khẩu</label>
        <div class="password-wrap">
          <input type="password" id="pw" placeholder="Ít nhất 6 ký tự" />
          <button class="eye-btn" onclick="togglePw('pw', this)">👁</button>
        </div>
      </div>

      <div class="field">
        <label for="cpw">Xác nhận mật khẩu</label>
        <div class="password-wrap">
          <input type="password" id="cpw" placeholder="Nhập lại mật khẩu" />
          <button class="eye-btn" onclick="togglePw('cpw', this)">👁</button>
        </div>
      </div>

      <div class="terms-row">
        <input type="checkbox" id="terms" />
        <label for="terms">
          Tôi đồng ý với <a href="#">Điều khoản dịch vụ</a> và
          <a href="#">Chính sách bảo mật</a> của SkyLa
        </label>
      </div>

      <!-- ✅ SỬA: Thêm onclick -->
      <button class="btn-register" id="btnRegister" onclick="handleSignUp()">
        Tạo tài khoản
      </button>

      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-text">hoặc</div>
        <div class="divider-line"></div>
      </div>

      <button class="btn-google" onclick="handleGoogleSignUp()">
        <div class="google-icon"></div>
        Đăng ký với Google
      </button>

      <div class="login-link">
        Đã có tài khoản? <a href="./login.html">Đăng nhập ngay</a>
      </div>
    </div>

    <!-- ✅ THÊM: Supabase config -->
    <script src="../js/supabase-config.js"></script>

    <script>
      function togglePw(id, btn) {
        const inp = document.getElementById(id);
        if (inp.type === "password") {
          inp.type = "text";
          btn.textContent = "🙈";
        } else {
          inp.type = "password";
          btn.textContent = "👁";
        }
      }

      function showMsg(text, isError = false) {
        const el = document.getElementById("auth-message");
        el.textContent = text;
        el.style.display = "block";
        el.style.background = isError
          ? "rgba(229,57,53,0.15)"
          : "rgba(76,175,80,0.15)";
        el.style.color = isError ? "#EF5350" : "#4CAF50";
        el.style.border = isError
          ? "1px solid rgba(229,57,53,0.3)"
          : "1px solid rgba(76,175,80,0.3)";
      }

      // ====================================================
      // ĐĂNG KÝ
      // ====================================================
      async function handleSignUp() {
        const ho = document.getElementById("ho").value.trim();
        const ten = document.getElementById("ten").value.trim();
        const email = document.getElementById("email").value.trim();
        const city = document.getElementById("city").value;
        const password = document.getElementById("pw").value;
        const confirmPw = document.getElementById("cpw").value;
        const terms = document.getElementById("terms").checked;
        const btn = document.getElementById("btnRegister");

        // ===== VALIDATE =====
        if (!ho || !ten) {
          showMsg("Vui lòng nhập họ và tên!", true);
          return;
        }
        if (!email) {
          showMsg("Vui lòng nhập email!", true);
          return;
        }
        if (!password || password.length < 6) {
          showMsg("Mật khẩu phải có ít nhất 6 ký tự!", true);
          return;
        }
        if (password !== confirmPw) {
          showMsg("Mật khẩu xác nhận không khớp!", true);
          return;
        }
        if (!terms) {
          showMsg("Bạn cần đồng ý với Điều khoản dịch vụ!", true);
          return;
        }

        btn.disabled = true;
        btn.textContent = "Đang tạo tài khoản...";

        const { data, error } = await _supabase.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              // Lưu thêm metadata vào user profile
              first_name: ten,
              last_name: ho,
              full_name: ho + " " + ten,
              city: city,
            },
          },
        });

        if (error) {
          showMsg("Lỗi đăng ký: " + error.message, true);
          btn.disabled = false;
          btn.textContent = "Tạo tài khoản";
          return;
        }

        // ✅ Thành công
        showMsg("Tạo tài khoản thành công! Đang chuyển đến đăng nhập...");
        setTimeout(() => {
          window.location.href = "login.html";
        }, 1500);
      }

      // ====================================================
      // ĐĂNG KÝ BẰNG GOOGLE
      // ====================================================
      async function handleGoogleSignUp() {
        const { data, error } = await _supabase.auth.signInWithOAuth({
          provider: "google",
          options: {
            redirectTo: window.location.origin + "/index.html",
          },
        });
        if (error) showMsg("Lỗi: " + error.message, true);
      }

      // Nếu đã đăng nhập → chuyển về trang chủ
      redirectIfLoggedIn();
    </script>
  </body>
</html>
