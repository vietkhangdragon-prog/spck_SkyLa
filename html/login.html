<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyLa — Đăng nhập</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <div class="brand">
      <div class="logo-circle">🌤️</div>
      <div class="brand-name">Sky<span>La</span></div>
      <div class="brand-tagline">Thời tiết thông minh cho cuộc sống của bạn</div>
    </div>

    <div class="weather-cards">
      <div class="weather-card">
        <div class="wc-icon">⛅</div>
        <div class="wc-info">
          <div class="wc-city">Hồ Chí Minh</div>
          <div class="wc-desc">Có mây rải rác</div>
        </div>
        <div class="wc-temp">34°</div>
      </div>
      <div class="weather-card">
        <div class="wc-icon">🌧️</div>
        <div class="wc-info">
          <div class="wc-city">Hà Nội</div>
          <div class="wc-desc">Mưa nhẹ</div>
        </div>
        <div class="wc-temp">27°</div>
      </div>
      <div class="weather-card">
        <div class="wc-icon">☀️</div>
        <div class="wc-info">
          <div class="wc-city">Đà Nẵng</div>
          <div class="wc-desc">Nắng đẹp</div>
        </div>
        <div class="wc-temp">31°</div>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="form-header">
      <div class="form-title">Chào mừng trở lại!</div>
      <div class="form-subtitle">Đăng nhập để xem thời tiết của bạn</div>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="email@example.com" />
    </div>

    <div class="field">
      <label for="pw">Mật khẩu</label>
      <div class="password-wrap">
        <input type="password" id="pw" placeholder="Nhập mật khẩu" />
        <button class="eye-btn" onclick="togglePw('pw', this)">👁</button>
      </div>
    </div>

    <div class="row-options">
      <div class="remember-row">
        <input type="checkbox" id="remember" />
        <label for="remember">Ghi nhớ đăng nhập</label>
      </div>
      <a href="#" class="forgot-link">Quên mật khẩu?</a>
    </div>

    <a href="./main.html" class="btn-login">Đăng nhập</a>

   

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">hoặc</div>
      <div class="divider-line"></div>
    </div>

    <button class="btn-google">
      <div class="google-icon"></div>
      Đăng nhập với Google
    </button>

    <div class="register-link">
      Chưa có tài khoản? <a href="./sign_up.html">Đăng ký miễn phí</a>
    </div>
  </div>

  <script>
    function togglePw(id, btn) {
      const inp = document.getElementById(id);
      if (inp.type === 'password') {
        inp.type = 'text';
        btn.textContent = '🙈';
      } else {
        inp.type = 'password';
        btn.textContent = '👁';
      }
    }
  </script>

</body>
</html>
