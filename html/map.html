<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyLa — Bản đồ</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="../css/map.css">
   
</head>
<body>

<nav class="navbar">
  <div class="nav-logo">Sky<span>La</span></div>
  <div class="nav-links">
    <a class="nav-link" href="../index.html">Trang chủ</a>
    <a class="nav-link active" href="#">Bản đồ</a>
    <a class="nav-link" href="./news.html">Tin tức</a>
    <a class="nav-link" href="./history.html">Lịch sử</a>
  </div>
  <div class="nav-right">
    <span class="update-badge" id="updateBadge">Đang tải...</span>
  </div>
</nav>

<div class="map-layout">
  <div class="map-panel">
    <div class="panel-header">
      <div class="panel-title">
        Tỉnh thành Việt Nam
        <span class="panel-badge">34 tỉnh thành 2025</span>
      </div>
      <div class="search-wrap">
        <span class="s-icon">🔍</span>
        <input type="text" id="citySearch" placeholder="Tìm tỉnh thành..." oninput="filterCities(this.value)" />
      </div>
    </div>

    <div class="region-tabs">
      <div class="region-tab active" onclick="setRegion('all',this)">Tất cả</div>
      <div class="region-tab" onclick="setRegion('Miền Bắc',this)">Miền Bắc</div>
      <div class="region-tab" onclick="setRegion('Bắc Trung Bộ',this)">Bắc TB</div>
      <div class="region-tab" onclick="setRegion('Nam Trung Bộ',this)">Nam TB</div>
      <div class="region-tab" onclick="setRegion('Miền Nam',this)">Miền Nam</div>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

    <div class="city-list" id="cityList">
      <div class="loading-msg">⏳ Đang tải thời tiết 34 tỉnh thành...</div>
    </div>

    <div class="stats-bar">
      <span>Đã tải: <span id="loadedCount">0</span>/34</span>
      <span>TB cả nước: <span id="avgTempAll">--</span></span>
    </div>

    <div class="layer-btns">
      <div class="layer-btn active" id="l0" onclick="setLayer('temp_new',this,'Nhiệt độ (°C)','linear-gradient(90deg,#42A5F5,#66BB6A,#EF9F27,#E53935)',['≤20°','28°','34°','≥38°'])">🌡 Nhiệt độ</div>
      <div class="layer-btn" id="l1" onclick="setLayer('clouds_new',this,'Độ mây (%)','linear-gradient(90deg,rgba(255,255,255,0.1),rgba(255,255,255,0.85))',['0%','','','100%'])">☁ Mây</div>
      <div class="layer-btn" id="l2" onclick="setLayer('wind_new',this,'Gió (m/s)','linear-gradient(90deg,#42A5F5,#66BB6A,#EF9F27,#E53935)',['0','5','10','≥15'])">💨 Gió</div>
      <div class="layer-btn" id="l3" onclick="setLayer('precipitation_new',this,'Mưa (mm)','linear-gradient(90deg,rgba(66,165,245,0.1),#42A5F5,#1565C0)',['0','','','10+'])">🌧 Mưa</div>
    </div>
  </div>

  <div class="map-area">
    <div id="leafletMap"></div>
    <div class="my-loc-btn" id="myLocBtn">📍</div>
    <div class="legend">
      <div class="legend-title" id="legendTitle">Nhiệt độ (°C)</div>
      <div class="legend-bar" id="legendBar" style="background:linear-gradient(90deg,#42A5F5,#66BB6A,#EF9F27,#E53935)"></div>
      <div class="legend-labels" id="legendLabels"><span>≤20°</span><span>28°</span><span>34°</span><span>≥38°</span></div>
    </div>
  </div>
</div>

<script>
  const API_KEY = '5d956ed49e280b8e42d187812de46ee7';
  let cityData = [], markers = [], selectedCity = null, activeRegion = 'all', searchQ = '', weatherLayer = null;

  // 34 tỉnh thành Việt Nam sau sáp nhập 1/7/2025
  // Nguồn: Nghị quyết 202/2025/QH15
  const cities = [
    // ===== MIỀN BẮC (14 tỉnh thành) =====
    { name:'Hà Nội', q:'Hanoi,VN', region:'Miền Bắc', merged:'Giữ nguyên', lat:21.0285, lon:105.8542 },
    { name:'Hải Phòng', q:'Hai Phong,VN', region:'Miền Bắc', merged:'Hải Phòng + Nam Định + Ninh Bình', lat:20.8449, lon:106.6881 },
    { name:'Quảng Ninh', q:'Ha Long,VN', region:'Miền Bắc', merged:'Giữ nguyên', lat:20.9714, lon:107.0418 },
    { name:'Bắc Ninh', q:'Bac Ninh,VN', region:'Miền Bắc', merged:'Bắc Ninh + Bắc Giang', lat:21.1861, lon:106.0763 },
    { name:'Hưng Yên', q:'Hung Yen,VN', region:'Miền Bắc', merged:'Hưng Yên + Thái Bình', lat:20.6464, lon:106.0511 },
    { name:'Hà Nam', q:'Ha Nam,VN', region:'Miền Bắc', merged:'Hà Nam + Hà Nội mở rộng', lat:20.5835, lon:105.9228 },
    { name:'Phú Thọ', q:'Viet Tri,VN', region:'Miền Bắc', merged:'Phú Thọ + Vĩnh Phúc + Hòa Bình', lat:21.3989, lon:105.4291 },
    { name:'Thái Nguyên', q:'Thai Nguyen,VN', region:'Miền Bắc', merged:'Thái Nguyên + Bắc Kạn', lat:21.5928, lon:105.8442 },
    { name:'Tuyên Quang', q:'Tuyen Quang,VN', region:'Miền Bắc', merged:'Tuyên Quang + Hà Giang', lat:21.8232, lon:105.2136 },
    { name:'Lào Cai', q:'Lao Cai,VN', region:'Miền Bắc', merged:'Lào Cai + Yên Bái', lat:22.4857, lon:103.9755 },
    { name:'Sơn La', q:'Son La,VN', region:'Miền Bắc', merged:'Giữ nguyên', lat:21.3256, lon:103.9144 },
    { name:'Điện Biên', q:'Dien Bien Phu,VN', region:'Miền Bắc', merged:'Giữ nguyên', lat:21.3856, lon:103.0232 },
    { name:'Lai Châu', q:'Lai Chau,VN', region:'Miền Bắc', merged:'Giữ nguyên', lat:22.3964, lon:103.4589 },
    { name:'Cao Bằng', q:'Cao Bang,VN', region:'Miền Bắc', merged:'Giữ nguyên', lat:22.6657, lon:106.2522 },
    { name:'Lạng Sơn', q:'Lang Son,VN', region:'Miền Bắc', merged:'Giữ nguyên', lat:21.8537, lon:106.7615 },

    // ===== BẮC TRUNG BỘ (5 tỉnh thành) =====
    { name:'Thanh Hóa', q:'Thanh Hoa,VN', region:'Bắc Trung Bộ', merged:'Giữ nguyên', lat:19.8067, lon:105.7851 },
    { name:'Nghệ An', q:'Vinh,VN', region:'Bắc Trung Bộ', merged:'Giữ nguyên', lat:18.6796, lon:105.6813 },
    { name:'Hà Tĩnh', q:'Ha Tinh,VN', region:'Bắc Trung Bộ', merged:'Giữ nguyên', lat:18.3417, lon:105.9056 },
    { name:'Quảng Trị', q:'Dong Ha,VN', region:'Bắc Trung Bộ', merged:'Quảng Bình + Quảng Trị', lat:16.8163, lon:107.0997 },
    { name:'Huế', q:'Hue,VN', region:'Bắc Trung Bộ', merged:'Giữ nguyên (TP trực thuộc TW)', lat:16.4637, lon:107.5909 },

    // ===== NAM TRUNG BỘ & TÂY NGUYÊN (6 tỉnh thành) =====
    { name:'Đà Nẵng', q:'Da Nang,VN', region:'Nam Trung Bộ', merged:'Đà Nẵng + Quảng Nam', lat:16.0544, lon:108.2022 },
    { name:'Quảng Ngãi', q:'Quang Ngai,VN', region:'Nam Trung Bộ', merged:'Quảng Ngãi + Kon Tum', lat:15.1214, lon:108.8044 },
    { name:'Gia Lai', q:'Pleiku,VN', region:'Nam Trung Bộ', merged:'Gia Lai + Bình Định', lat:13.9833, lon:108.0 },
    { name:'Đắk Lắk', q:'Buon Ma Thuot,VN', region:'Nam Trung Bộ', merged:'Đắk Lắk + Phú Yên', lat:12.6667, lon:108.05 },
    { name:'Khánh Hòa', q:'Nha Trang,VN', region:'Nam Trung Bộ', merged:'Khánh Hòa + Ninh Thuận', lat:12.2388, lon:109.1967 },
    { name:'Lâm Đồng', q:'Da Lat,VN', region:'Nam Trung Bộ', merged:'Lâm Đồng + Bình Thuận + Đắk Nông', lat:11.9404, lon:108.4583 },

    // ===== MIỀN NAM (9 tỉnh thành) =====
    { name:'TP. Hồ Chí Minh', q:'Ho Chi Minh City,VN', region:'Miền Nam', merged:'TP.HCM + Bình Dương + Bà Rịa-VT', lat:10.8231, lon:106.6297 },
    { name:'Đồng Nai', q:'Bien Hoa,VN', region:'Miền Nam', merged:'Đồng Nai + Bình Phước', lat:10.9574, lon:106.8426 },
    { name:'Tây Ninh', q:'Tay Ninh,VN', region:'Miền Nam', merged:'Tây Ninh + Long An', lat:11.3352, lon:106.1098 },
    { name:'Tiền Giang', q:'My Tho,VN', region:'Miền Nam', merged:'Tiền Giang + Bến Tre', lat:10.3597, lon:106.3605 },
    { name:'Vĩnh Long', q:'Vinh Long,VN', region:'Miền Nam', merged:'Vĩnh Long + Trà Vinh + Bến Tre', lat:10.2397, lon:105.9572 },
    { name:'Đồng Tháp', q:'Cao Lanh,VN', region:'Miền Nam', merged:'Đồng Tháp + Tiền Giang mở rộng', lat:10.4497, lon:105.6338 },
    { name:'An Giang', q:'Long Xuyen,VN', region:'Miền Nam', merged:'An Giang + Kiên Giang', lat:10.3861, lon:105.4349 },
    { name:'Cần Thơ', q:'Can Tho,VN', region:'Miền Nam', merged:'Cần Thơ + Hậu Giang + Sóc Trăng', lat:10.0452, lon:105.7469 },
    { name:'Cà Mau', q:'Ca Mau,VN', region:'Miền Nam', merged:'Cà Mau + Bạc Liêu', lat:9.1769, lon:105.1524 },
  ];

  // LEAFLET MAP
  const map = L.map('leafletMap', { center:[16.5,107.0], zoom:6 });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution:'© OpenStreetMap © CARTO', subdomains:'abcd', maxZoom:19
  }).addTo(map);

  function setLayer(tile,btn,title,bar,labels) {
    document.querySelectorAll('.layer-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    if(weatherLayer) map.removeLayer(weatherLayer);
    weatherLayer = L.tileLayer(`https://tile.openweathermap.org/map/${tile}/{z}/{x}/{y}.png?appid=${API_KEY}`,{opacity:0.55,maxZoom:19}).addTo(map);
    document.getElementById('legendTitle').textContent=title;
    document.getElementById('legendBar').style.background=bar;
    document.getElementById('legendLabels').innerHTML=labels.map(l=>`<span>${l}</span>`).join('');
  }
  setLayer('temp_new',document.getElementById('l0'),'Nhiệt độ (°C)','linear-gradient(90deg,#42A5F5,#66BB6A,#EF9F27,#E53935)',['≤20°','28°','34°','≥38°']);

  function getTempColor(t) {
    if(t<=22) return '#42A5F5';
    if(t<=27) return '#66BB6A';
    if(t<=32) return '#EF9F27';
    return '#E53935';
  }

  function getIcon(id) {
    if(id>=200&&id<300) return '⛈️';
    if(id>=300&&id<400) return '🌦️';
    if(id>=500&&id<600) return '🌧️';
    if(id>=600&&id<700) return '❄️';
    if(id>=700&&id<800) return '🌫️';
    if(id===800) return '☀️';
    if(id===801) return '🌤️';
    if(id===802) return '⛅';
    if(id>=803) return '☁️';
    return '🌡️';
  }

  function getWindDir(deg) {
    return ['Bắc','ĐB','Đông','ĐN','Nam','TN','Tây','TB'][Math.round((deg||0)/45)%8];
  }

  function addMarker(c) {
    const w = c.weather;
    const temp = Math.round(w.main.temp);
    const color = getTempColor(temp);
    const icon = getIcon(w.weather[0].id);
    const spd = Math.round(w.wind.speed * 3.6);

    const mi = L.divIcon({
      className:'',
      html:`<div style="background:${color};color:#fff;font-family:'Nunito',sans-serif;font-weight:900;font-size:12px;padding:3px 8px;border-radius:16px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.45);border:1.5px solid rgba(255,255,255,0.2);cursor:pointer;">${icon} ${temp}°</div>`,
      iconAnchor:[28,14],
    });

    const isMerged = c.merged !== 'Giữ nguyên';
    const popup = `
      <div class="popup-city">${icon} ${w.name} · ${c.region}</div>
      ${isMerged?`<div class="popup-merged">🔗 Sáp nhập: ${c.merged}</div>`:''}
      <div class="popup-temp">${temp}°C</div>
      <div class="popup-desc">${w.weather[0].description} · Cảm giác ${Math.round(w.main.feels_like)}°</div>
      <div class="popup-row">
        <div class="popup-item">Độ ẩm<span>${w.main.humidity}%</span></div>
        <div class="popup-item">Gió<span>${spd}km/h</span></div>
        <div class="popup-item">Hướng<span>${getWindDir(w.wind.deg)}</span></div>
        <div class="popup-item">Tầm nhìn<span>${Math.round((w.visibility||10000)/1000)}km</span></div>
      </div>`;

    const marker = L.marker([w.coord.lat, w.coord.lon], {icon:mi})
      .addTo(map).bindPopup(popup,{maxWidth:250});
    marker.on('click',()=>{ selectedCity=c.name; renderCityList(getFiltered()); });
    markers.push({name:c.name, marker});
  }

  async function loadAllCities() {
    let loaded = 0;
    const BATCH = 5;
    const results = [];

    for(let i=0; i<cities.length; i+=BATCH) {
      const batch = cities.slice(i, i+BATCH);
      const batchRes = await Promise.all(
        batch.map(c =>
          fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(c.q)}&appid=${API_KEY}&units=metric&lang=vi`)
            .then(r=>r.ok?r.json():null).then(w=>w?{...c,weather:w}:null).catch(()=>null)
        )
      );
      const valid = batchRes.filter(Boolean);
      results.push(...valid);
      loaded += valid.length;
      document.getElementById('progressFill').style.width=(loaded/cities.length*100)+'%';
      document.getElementById('loadedCount').textContent=loaded;
      valid.forEach(c=>addMarker(c));
      if(i+BATCH<cities.length) await new Promise(r=>setTimeout(r,220));
    }

    cityData = results;
    const avg = Math.round(results.reduce((s,c)=>s+c.weather.main.temp,0)/results.length);
    document.getElementById('avgTempAll').textContent=avg+'°C';
    renderCityList(cityData);

    const now = new Date();
    document.getElementById('updateBadge').textContent=`Cập nhật: ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} · 34 tỉnh thành (2025)`;
    document.getElementById('progressFill').style.width='100%';
  }

  function getFiltered() {
    let data=[...cityData];
    if(activeRegion!=='all') data=data.filter(c=>c.region===activeRegion);
    if(searchQ) data=data.filter(c=>c.name.toLowerCase().includes(searchQ.toLowerCase())||c.weather.name.toLowerCase().includes(searchQ.toLowerCase()));
    return data;
  }

  function renderCityList(data) {
    const list=document.getElementById('cityList');
    if(!data.length){list.innerHTML='<div class="loading-msg">Không tìm thấy</div>';return;}
    list.innerHTML=data.map(c=>{
      const w=c.weather, temp=Math.round(w.main.temp);
      const isMerged=c.merged!=='Giữ nguyên';
      return `<div class="city-item${selectedCity===c.name?' selected':''}" onclick="focusCity('${c.name}')">
        <div class="ci-icon">${getIcon(w.weather[0].id)}</div>
        <div class="ci-info">
          <div class="ci-name">${c.name}${isMerged?' 🔗':''}</div>
          <div class="ci-sub">${c.region}</div>
        </div>
        <div class="ci-temp" style="color:${getTempColor(temp)}">${temp}°</div>
      </div>`;
    }).join('');
  }

  function focusCity(name) {
    selectedCity=name;
    renderCityList(getFiltered());
    const c=cityData.find(c=>c.name===name);
    if(!c)return;
    map.flyTo([c.weather.coord.lat,c.weather.coord.lon],10,{duration:1.2});
    const m=markers.find(m=>m.name===name);
    if(m)m.marker.openPopup();
  }

  function filterCities(q){searchQ=q;renderCityList(getFiltered());}

  function setRegion(r,btn){
    activeRegion=r;
    document.querySelectorAll('.region-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderCityList(getFiltered());
  }

  document.getElementById('myLocBtn').addEventListener('click',()=>{
    if(!navigator.geolocation){alert('Trình duyệt không hỗ trợ GPS!');return;}
    const btn=document.getElementById('myLocBtn');
    btn.textContent='⏳';
    navigator.geolocation.getCurrentPosition(pos=>{
      const {latitude:lat,longitude:lon}=pos.coords;
      map.flyTo([lat,lon],12,{duration:1.5});
      fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=vi`)
        .then(r=>r.json()).then(w=>{
          L.popup().setLatLng([lat,lon]).setContent(`
            <div class="popup-city">📍 Vị trí của bạn · ${w.name}</div>
            <div class="popup-temp">${Math.round(w.main.temp)}°C</div>
            <div class="popup-desc">${w.weather[0].description}</div>
            <div class="popup-row">
              <div class="popup-item">Độ ẩm<span>${w.main.humidity}%</span></div>
              <div class="popup-item">Gió<span>${Math.round(w.wind.speed*3.6)}km/h</span></div>
            </div>`).openOn(map);
          btn.textContent='📍';
        }).catch(()=>{btn.textContent='📍';});
    },()=>{btn.textContent='📍';alert('Không lấy được vị trí!');});
  });

  loadAllCities();
</script>
</body>
</html>
